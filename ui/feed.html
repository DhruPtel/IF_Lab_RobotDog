<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dog Council Feed</title>
<style>
/*
  Agent council feed for the Grayson (robodog) showcase, laid out like the desktop X timeline.
  Layout only: events come from SAMPLE_EVENTS below. See ui/README.md.
*/
:root {
  --bg: #000000;
  --text: #e7e9ea;
  --muted: #71767b;
  --border: #2f3336;
  --blue: #1d9bf0;
  --blue-hover: #1a8cd8;
  --green: #00ba7c;
  --pink: #f91880;
  --light: #eff3f4;
  --dark-text: #0f1419;
  --hover: rgba(231, 233, 234, 0.1);
  --row-hover: rgba(255, 255, 255, 0.03);
  --header-bg: rgba(0, 0, 0, 0.65);

  --nav-w: 275px;
  --main-w: 600px;
  --side-w: 350px;
  --side-gap: 30px;

  --planner: #7856ff;
  --scout: #00ba7c;
  --safety: #f4212e;
  --pilot: #1d9bf0;
  --scribe: #ffd400;
  --system: #e7e9ea;

  --font: "TwitterChirp", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 15px/20px var(--font); -webkit-font-smoothing: antialiased; overflow-y: scroll; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
a { color: var(--blue); text-decoration: none; cursor: pointer; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
svg.i { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.fill { fill: currentColor; stroke: none; }
.muted { color: var(--muted); }
.bold { font-weight: 700; }

/* ─── three columns ─────────────────────────────────────────── */
.layout { display: flex; justify-content: center; min-height: 100vh; }
.nav-col { width: var(--nav-w); flex: none; }
.nav-inner {
  position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column;
  padding: 0 8px; overflow-y: auto;
}
.main-col {
  width: var(--main-w); flex: none;
  border-left: 1px solid var(--border); border-right: 1px solid var(--border);
  min-height: 100vh;
}
.side-col { width: var(--side-w); margin-left: var(--side-gap); margin-right: 10px; flex: none; }

/* ─── left nav ──────────────────────────────────────────────── */
.logo { width: 52px; height: 52px; margin-top: 2px; border-radius: 9999px; display: grid; place-items: center; color: var(--text); }
.logo:hover { background: var(--hover); }
.logo svg { width: 30px; height: 30px; }
.nav { display: flex; flex-direction: column; margin-top: 2px; }
.nav-item { display: flex; padding: 0; color: var(--text); }
.nav-item:hover { text-decoration: none; }
.nav-item > span {
  display: inline-flex; align-items: center; gap: 20px;
  padding: 12px; border-radius: 9999px;
  font-size: 20px; line-height: 24px;
  transition: background-color .2s;
}
.nav-item:hover > span { background: var(--hover); }
.nav-item .label { padding-right: 16px; }
.nav-item.active { font-weight: 700; }
.nav-item svg.i { width: 26.25px; height: 26.25px; stroke-width: 1.9; }
.nav-item.active svg.i { stroke-width: 2.6; }
.nav-item.active svg.i.fill { stroke-width: 0; }
.nav-icon { position: relative; display: inline-flex; }
.badge {
  position: absolute; top: -6px; right: -6px;
  min-width: 18px; height: 18px; padding: 0 5px;
  border-radius: 9999px; border: 1px solid var(--bg);
  background: var(--blue); color: #fff;
  font-size: 11px; line-height: 16px; font-weight: 700; text-align: center;
}
.btn-post-big {
  width: 90%; height: 52px; margin: 16px 0;
  border-radius: 9999px; background: var(--light); color: var(--dark-text);
  font-size: 17px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center;
}
.btn-post-big:hover { background: #d7dbdc; }
.btn-post-big svg { display: none; width: 24px; height: 24px; }
.account {
  margin: auto 0 12px; padding: 12px; border-radius: 9999px;
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
}
.account:hover { background: var(--hover); }
.account .who { flex: 1; min-width: 0; line-height: 20px; }
.account .who div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ─── avatars ───────────────────────────────────────────────── */
.av {
  width: 40px; height: 40px; border-radius: 9999px; flex: none;
  display: grid; place-items: center;
  background: var(--c, var(--system)); color: #000;
  font-weight: 800; font-size: 17px;
}
.av svg { width: 60%; height: 60%; }
.av img { width: 100%; height: 100%; border-radius: inherit; object-fit: cover; display: block; }
.av[data-agent="system"] { background: #333639; overflow: hidden; }
.av.s32 { width: 32px; height: 32px; font-size: 14px; }
.av.s20 { width: 20px; height: 20px; font-size: 10px; border: 1px solid var(--bg); }
.av.s134 { width: 134px; height: 134px; font-size: 56px; border: 4px solid var(--bg); }
[data-agent="planner"] { --c: var(--planner); }
[data-agent="scout"] { --c: var(--scout); }
[data-agent="safety"] { --c: var(--safety); }
[data-agent="pilot"] { --c: var(--pilot); }
[data-agent="scribe"] { --c: var(--scribe); }
[data-agent="system"] { --c: var(--system); }
svg.i.verified { width: 18.75px; height: 18.75px; color: var(--blue); margin-left: 2px; vertical-align: -4px; }

/* ─── sticky headers + tabs ─────────────────────────────────── */
.top {
  position: sticky; top: 0; z-index: 3;
  background: var(--header-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.title-bar { display: flex; align-items: center; gap: 4px; min-height: 53px; padding: 0 16px; }
.title-bar h2 { font-size: 20px; line-height: 24px; font-weight: 700; margin: 0; }
.title-bar .sub { font-size: 13px; line-height: 16px; color: var(--muted); }
.icon-btn {
  width: 34px; height: 34px; border-radius: 9999px;
  display: inline-grid; place-items: center; flex: none;
}
.icon-btn:hover { background: var(--hover); }
.icon-btn svg { width: 20px; height: 20px; }
.back { margin-right: 28px; margin-left: -8px; }
.tabs { display: flex; height: 53px; }
.tabs.bordered { border-bottom: 1px solid var(--border); }
.tab {
  flex: 1; display: flex; justify-content: center;
  color: var(--muted); font-weight: 500;
}
.tab:hover { background: var(--hover); }
.tab > span { position: relative; display: flex; align-items: center; height: 100%; }
.tab.active { color: var(--text); font-weight: 700; }
.tab-plus { flex: none; width: 53px; display: grid; place-items: center; color: var(--text); }
.tab-plus:hover { background: var(--hover); }
.tab-plus svg { width: 20px; height: 20px; }
.tab.active > span::after {
  content: ""; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
  min-width: 56px; width: 100%; height: 4px; border-radius: 9999px; background: var(--blue);
}

/* ─── compose ───────────────────────────────────────────────── */
.compose { display: flex; gap: 8px; padding: 4px 16px 0; border-bottom: 1px solid var(--border); }
.compose .av { margin-top: 12px; }
.compose-body { flex: 1; min-width: 0; padding-top: 4px; }
.compose textarea {
  width: 100%; resize: none; border: 0; outline: none; background: none;
  font-size: 20px; line-height: 24px; padding: 12px 0; height: 52px; overflow: hidden;
}
.compose textarea::placeholder { color: var(--muted); }
.compose-tools { display: flex; align-items: center; justify-content: space-between; padding: 8px 0 12px; margin-left: -8px; }
.compose-tools .icons { display: flex; }
.compose-tools .icon-btn { color: var(--text); opacity: .85; }
.compose-tools .icon-btn:hover { background: rgba(29, 155, 240, .1); }
.btn-pill {
  height: 36px; padding: 0 16px; border-radius: 9999px;
  font-weight: 700; font-size: 15px; flex: none;
}
.btn-light { background: var(--light); color: var(--dark-text); }
.btn-light:hover { background: #d7dbdc; }
.btn-light:disabled { opacity: .5; cursor: default; }
.btn-blue { background: var(--blue); color: #fff; }
.btn-blue:hover { background: var(--blue-hover); }
.btn-outline { border: 1px solid #536471; color: var(--text); }
.btn-outline:hover { background: var(--hover); }
.btn-sm { height: 32px; font-size: 14px; }

/* ─── posts ─────────────────────────────────────────────────── */
.post {
  display: flex; gap: 8px; padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  transition: background-color .2s;
}
.post:hover { background: var(--row-hover); }
.post.is-new { animation: arrive 1.2s ease-out; }
@keyframes arrive { from { background: rgba(29, 155, 240, .12); } }
.post-body { flex: 1; min-width: 0; }
.post-head { display: flex; align-items: flex-start; gap: 4px; }
.post-head .meta { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.post-head .name { font-weight: 700; color: var(--text); }
.post-head .dots { margin: -8px -8px -8px 0; color: var(--muted); }
.post-head .dots:hover { color: var(--blue); background: rgba(29, 155, 240, .1); }
.replying { color: var(--muted); }
.post-text { white-space: pre-line; overflow-wrap: anywhere; }
.post-text b { font-weight: 700; }
.kind-tag { color: var(--muted); }
.kind-tag.veto { color: var(--pink); font-weight: 700; }

.card {
  margin-top: 12px; border: 1px solid var(--border); border-radius: 16px; overflow: hidden;
}
.card .code {
  padding: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 14px; line-height: 20px; border-bottom: 1px solid var(--border);
}
.card .frame {
  aspect-ratio: 16 / 9; background: #16181c; border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-end; padding: 12px; color: var(--muted);
  position: relative;
}
.card .frame::before { content: ""; position: absolute; inset: 52% 0 0; background: #202327; }
.card .frame span { position: relative; }
.card .result { padding: 12px; color: var(--muted); }
.card .result.bad { color: var(--pink); font-weight: 700; }
.quote { padding: 12px; }
.quote .qhead { display: flex; align-items: center; gap: 4px; margin-bottom: 2px; }
.quote .qhead svg.i.verified { margin-left: 0; vertical-align: 0; }

.actions { display: flex; justify-content: space-between; max-width: 425px; margin-top: 12px; margin-left: -8px; }
.act { display: inline-flex; align-items: center; color: var(--muted); font-size: 13px; line-height: 16px; }
.act .ring { width: 34px; height: 34px; border-radius: 9999px; display: grid; place-items: center; transition: background-color .2s, color .2s; }
.act svg { width: 18.75px; height: 18.75px; }
.act .n { padding: 0 12px 0 1px; min-width: 1ch; }
.act.reply:hover { color: var(--blue); } .act.reply:hover .ring { background: rgba(29, 155, 240, .1); }
.act.ok:hover, .act.ok.on { color: var(--green); } .act.ok:hover .ring { background: rgba(0, 186, 124, .1); }
.act.no:hover, .act.no.on { color: var(--pink); } .act.no:hover .ring { background: rgba(249, 24, 128, .1); }
.act.view:hover { color: var(--blue); } .act.view:hover .ring { background: rgba(29, 155, 240, .1); }
.act-right { display: flex; }

.empty { padding: 32px; max-width: 400px; margin: 0 auto; }
.empty h3 { font-size: 31px; line-height: 36px; font-weight: 800; margin: 0 0 8px; }
.empty p { color: var(--muted); margin: 0; }

/* ─── profile ───────────────────────────────────────────────── */
.banner { aspect-ratio: 3 / 1; background: color-mix(in srgb, var(--c) 45%, #000); }
.banner.photo { background: #333639 url(img/grayson-banner.jpg) center / cover no-repeat; }
.pinned { display: flex; align-items: center; gap: 12px; padding: 12px 16px 0; margin-bottom: -8px; color: var(--muted); font-size: 13px; line-height: 16px; font-weight: 700; }
.pinned span:first-child { width: 40px; display: flex; justify-content: flex-end; }
.pinned svg { width: 16px; height: 16px; }
.pinned + .post { padding-top: 12px; }
.video { aspect-ratio: 16 / 9; background: #16181c; }
.video iframe { width: 100%; height: 100%; border: 0; display: block; }
.card .video-link { display: block; padding: 12px; color: var(--muted); }
.profile-top { padding: 12px 16px 0; }
.profile-row { display: flex; justify-content: space-between; align-items: flex-start; height: 72px; }
.profile-row .av { margin-top: -79px; }
.profile-name { font-size: 20px; line-height: 24px; font-weight: 800; margin-top: 4px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.role-pill {
  display: inline-flex; align-items: center; gap: 4px;
  height: 28px; padding: 0 12px; border: 1px solid #536471; border-radius: 9999px;
  font-size: 15px; font-weight: 700;
}
.role-pill svg.i.verified { margin: 0; vertical-align: 0; }
.profile-bio { margin: 12px 0; }
.profile-meta { display: flex; flex-wrap: wrap; gap: 0 12px; color: var(--muted); margin-bottom: 12px; }
.profile-meta span { display: inline-flex; align-items: center; gap: 4px; }
.profile-meta svg { width: 18.75px; height: 18.75px; }
.profile-stats { display: flex; gap: 20px; color: var(--muted); padding-bottom: 12px; }
.profile-stats b { color: var(--text); }

/* ─── notifications ─────────────────────────────────────────── */
.note { display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.note:hover { background: var(--row-hover); }
.note .kind-ico { width: 40px; display: flex; justify-content: flex-end; flex: none; }
.note .kind-ico svg { width: 30px; height: 30px; }
.note .kind-ico.ok { color: var(--green); }
.note .kind-ico.no { color: var(--pink); }
.note .kind-ico.chk { color: var(--blue); }
.note-body { flex: 1; min-width: 0; }
.note-body .line { margin: 12px 0 0; }
.note-body .quoted { color: var(--muted); margin-top: 12px; }

/* ─── list rows ─────────────────────────────────────────────── */
.row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; transition: background-color .2s; }
.row:hover { background: var(--row-hover); }
.row .who { flex: 1; min-width: 0; }
.row .who div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .bio { white-space: normal !important; margin-top: 4px; }
.section-title { font-size: 20px; line-height: 24px; font-weight: 800; padding: 12px 16px; margin: 0; }
.radio { width: 20px; height: 20px; border: 2px solid #536471; border-radius: 9999px; flex: none; }
.radio.on { border: 6px solid var(--blue); }

pre.log { margin: 0; padding: 12px 16px; font: 13px/18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }

/* ─── right sidebar ─────────────────────────────────────────── */
.side-inner { padding-bottom: 64px; }
.search-wrap { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 4px 0 12px; }
.search {
  display: flex; align-items: center; height: 44px;
  border: 1px solid var(--border); border-radius: 9999px; padding: 0 12px;
}
.search:focus-within { border-color: var(--blue); }
.search svg { width: 18.75px; height: 18.75px; color: var(--muted); }
.search:focus-within svg { color: var(--blue); }
.search input { flex: 1; border: 0; outline: none; background: none; padding: 0 8px; font-size: 15px; min-width: 0; }
.search input::placeholder { color: var(--muted); }
.side-card { border: 1px solid var(--border); border-radius: 16px; margin-bottom: 16px; overflow: hidden; }
.side-card h2 { font-size: 20px; line-height: 24px; font-weight: 800; margin: 0; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
.side-card h2 .icon-btn { margin: -6px -6px -6px 0; }
.side-card .pad { padding: 0 16px 12px; }
.side-card .pad p { margin: 0 0 12px; }
.side-item { padding: 12px 16px; cursor: pointer; transition: background-color .2s; }
.side-item:hover { background: var(--row-hover); }
.news-title { font-weight: 700; }
.news-meta { display: flex; align-items: center; gap: 8px; margin-top: 4px; color: var(--muted); font-size: 13px; line-height: 16px; }
.stack { display: flex; }
.stack .av + .av { margin-left: -6px; }
.trend { display: flex; justify-content: space-between; }
.trend .meta { color: var(--muted); font-size: 13px; line-height: 16px; }
.trend .val { font-weight: 700; margin-top: 2px; }
.trend .icon-btn { color: var(--muted); margin: -8px -8px 0 0; width: 30px; height: 30px; }
.show-more { display: block; padding: 16px; color: var(--blue); }
.show-more:hover { background: var(--row-hover); text-decoration: none; }
.side-foot { padding: 0 16px; color: var(--muted); font-size: 13px; line-height: 16px; }
.side-foot span { margin-right: 12px; display: inline-block; }

.map-box { padding: 0 16px 4px; cursor: pointer; }
.map { width: 100%; height: auto; display: block; border-radius: 12px; background: #16181c; }
.map .grid { stroke: #202327; stroke-width: .02; }
.map .wall { fill: none; stroke: #536471; stroke-width: .05; }
.map .obstacle { fill: #2f3336; stroke: #536471; stroke-width: .02; }
.map .person { fill: rgba(249, 24, 128, .15); stroke: var(--pink); stroke-width: .025; stroke-dasharray: .06 .05; }
.map .goal { fill: rgba(0, 186, 124, .08); stroke: var(--green); stroke-width: .035; stroke-dasharray: .1 .07; }
.map .trail { fill: none; stroke: var(--blue); stroke-width: .045; stroke-linecap: round; stroke-linejoin: round; }
.map text { font: 700 .16px var(--font); fill: var(--muted); }
.map .dog-body { fill: var(--text); }
.map .dog-nose { fill: #000; }

/* ─── floating buttons ──────────────────────────────────────── */
.fabs { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 14px; z-index: 5; }
.fab {
  width: 53px; height: 53px; border-radius: 16px;
  background: var(--bg); border: 1px solid var(--border);
  box-shadow: 0 0 15px rgba(255, 255, 255, .2), 0 0 3px 1px rgba(255, 255, 255, .15);
  display: grid; place-items: center;
}
.fab:hover { background: #16181c; }
.fab svg { width: 26px; height: 26px; }
.fab .lbl { font-weight: 800; font-size: 15px; }

/* ─── responsive (mirrors X's breakpoints) ──────────────────── */
@media (max-width: 1280px) {
  .nav-col { width: 88px; }
  .nav-inner { align-items: center; }
  .nav-item .label, .account .who, .account .acc-dots { display: none; }
  .nav-item > span { gap: 0; }
  .btn-post-big { width: 52px; height: 52px; }
  .btn-post-big .txt { display: none; }
  .btn-post-big svg { display: inline; }
  .account { width: auto; }
}
@media (max-width: 1000px) { .side-col { display: none; } }
@media (max-width: 700px) {
  .nav-col { width: 68px; }
  .nav-inner { padding: 0 4px; }
  .main-col { width: auto; flex: 1; min-width: 0; border-right: 0; }
  .fabs { right: 12px; bottom: 12px; }
  .compose-tools .icons .icon-btn:nth-child(n+4) { display: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="layout">
  <header class="nav-col"><div class="nav-inner" id="nav"></div></header>
  <main class="main-col" id="view"></main>
  <aside class="side-col"><div class="side-inner" id="side"></div></aside>
</div>
<div class="fabs">
  <button class="fab" id="fab-play" aria-label="Pause playback"></button>
  <button class="fab" id="fab-speed" aria-label="Change playback speed"><span class="lbl">1×</span></button>
</div>

<script>
/* ─── icons (drawn for this page, 24×24) ─────────────────────── */
const P = {
  paw: '<ellipse cx="6" cy="9.5" rx="2.2" ry="2.8"/><ellipse cx="10" cy="5" rx="2.2" ry="2.8"/><ellipse cx="15" cy="5" rx="2.2" ry="2.8"/><ellipse cx="19" cy="9.5" rx="2.2" ry="2.8"/><path d="M12.5 11c-3 0-6.5 4.3-6.5 7.2 0 2 1.6 2.8 3.4 2.8 1.4 0 2-.6 3.1-.6s1.7.6 3.1.6c1.8 0 3.4-.8 3.4-2.8 0-2.9-3.5-7.2-6.5-7.2z"/>',
  home: '<path d="M3 10.5 12 3l9 7.5V21h-6v-6.5H9V21H3z"/>',
  search: '<circle cx="10.5" cy="10.5" r="7"/><path d="m16 16 5 5"/>',
  bell: '<path d="M6 10a6 6 0 0 1 12 0c0 4.5 1.5 6.5 2.5 7.5h-17C4.5 16.5 6 14.5 6 10z"/><path d="M9.5 20.5a2.5 2.5 0 0 0 5 0"/>',
  agents: '<circle cx="9.5" cy="8" r="4"/><path d="M2.5 21c0-4 3.1-6.5 7-6.5s7 2.5 7 6.5"/><path d="M19.5 7v6M16.5 10h6"/>',
  pin: '<path d="M12 21.5s7-6.6 7-12a7 7 0 0 0-14 0c0 5.4 7 12 7 12z"/><circle cx="12" cy="9.5" r="2.5"/>',

/* ─── components ────────────────────────────────────────────── */
function Avatar(key, size = "") {
  const inner = key === "system" ? `<img src="img/grayson-avatar.jpg" alt="">` : AGENTS[key].initial;
  return `<div class="av ${size}" data-agent="${key}" aria-hidden="true">${inner}</div>`;
}
const Verified = () => icon("check", "verified");

function ago(at) {
  const s = Math.max(0, Math.round((Date.now() - at) / 1000));
  if (s < 60) return `${s}s`;
  if (s < 3600) return `${Math.floor(s / 60)}m`;
  return `${Math.floor(s / 3600)}h`;
}

function counts(ev) {
  return {
    replies: S.shown.filter((e) => e.reply_to === ev.id).length,
    yes: (ev.votes || []).filter((v) => v[1] === "yes").length,
    no: (ev.votes || []).filter((v) => v[1] === "no").length,
  };
}

const KIND = { mission: "", proposal: "Proposal", check: "Check", objection: "Veto", approval: "Approved", action: "Action", finding: "Report", summary: "Summary" };

function Post(ev) {
  const a = AGENTS[ev.agent];
  const parent = ev.reply_to && S.byId[ev.reply_to];
  const c = counts(ev);
  let h = `<article class="post${ev.id === S.newestId ? " is-new" : ""}" data-id="${ev.id}">
    <a data-profile="${ev.agent}" aria-label="${a.name}">${Avatar(ev.agent)}</a>
    <div class="post-body">
      <div class="post-head">
        <div class="meta"><a class="name" data-profile="${ev.agent}">${a.name}</a>${Verified()}
          <span class="muted"> @${a.handle} · <time data-at="${ev._at}">${ago(ev._at)}</time></span>${KIND[ev.kind] ? `<span class="kind-tag${ev.kind === "objection" ? " veto" : ""}"> · ${KIND[ev.kind]}</span>` : ""}</div>
        <button class="icon-btn dots" aria-label="More">${icon("dots")}</button>
      </div>`;
  if (parent) h += `<div class="replying">Replying to <a data-profile="${parent.agent}">@${AGENTS[parent.agent].handle}</a></div>`;
  h += `<div class="post-text">${ev.text}</div>`;
  if (ev.action) {
    const args = Object.entries(ev.action.args).map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(", ");
    h += `<div class="card">
      ${ev.action.frame ? `<div class="frame"><span>${esc(ev.action.frame)}</span></div>` : ""}
      <div class="code">${esc(ev.action.tool)}(${esc(args)})</div>
      <div class="result${ev.action.ok === false ? " bad" : ""}">${esc(ev.action.result)}</div></div>`;
  } else if (parent && (ev.kind === "objection" || ev.kind === "approval")) {
    const pa = AGENTS[parent.agent];
    h += `<div class="card quote"><div class="qhead">${Avatar(parent.agent, "s20")}<b>${pa.name}</b>${Verified()}<span class="muted">@${pa.handle}</span></div>${parent.text}</div>`;
  }
  h += `<div class="actions">
      <span class="act reply" title="Replies"><span class="ring">${icon("reply")}</span><span class="n">${c.replies || ""}</span></span>
      <span class="act ok${c.yes ? " on" : ""}" title="Approvals"><span class="ring">${icon("ok")}</span><span class="n">${c.yes || ""}</span></span>
      <span class="act no${c.no ? " on" : ""}" title="Vetoes"><span class="ring">${icon("no")}</span><span class="n">${c.no || ""}</span></span>
      <span class="act view" title="Step number"><span class="ring">${icon("views")}</span><span class="n">${ev.id}</span></span>
      <span class="act-right"><span class="act view" title="Save"><span class="ring">${icon("log")}</span></span><span class="act view" title="Share"><span class="ring">${icon("share")}</span></span></span>
    </div></div></article>`;
  return h;
}

}

function MapSvg() {
  const { w, h } = MISSION.room, g = MISSION.goalZone;
  let s = `<svg class="map" viewBox="-0.2 -0.2 6.4 4.4" role="img" aria-label="Top-down map of the lab and Grayson's path">`;
  for (let x = 1; x < w; x++) s += `<line class="grid" x1="${x}" y1="0" x2="${x}" y2="${h}"/>`;
  for (let y = 1; y < h; y++) s += `<line class="grid" x1="0" y1="${y}" x2="${w}" y2="${y}"/>`;
  s += `<rect class="goal" x="${g.x}" y="${g.y}" width="${g.w}" height="${g.h}" rx=".08"/><text x="${g.x}" y="${g.y - .08}">goal</text>`;
  for (const o of MISSION.obstacles) s += `<rect class="obstacle" x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}" rx=".05"/><text x="${o.x}" y="${o.y - .08}">${o.label}</text>`;
  for (const p of MISSION.people) s += `<circle class="person" cx="${p.x}" cy="${p.y}" r="${p.r}"/><text x="${p.x + p.r + .06}" y="${p.y + .06}">${p.label}</text>`;
  s += `<rect class="wall" x="0" y="0" width="${w}" height="${h}" rx=".05"/>`;
  if (S.path.length) {
    s += `<polyline class="trail" points="${S.path.map((q) => `${q.x},${q.y}`).join(" ")}"/>`;
    const last = S.path.at(-1);
    s += `<g transform="translate(${last.x} ${last.y}) rotate(${last.h})"><rect class="dog-body" x="-.2" y="-.12" width=".4" height=".24" rx=".08"/><circle class="dog-nose" cx=".12" cy="0" r=".045"/></g>`;
  }
  return s + "</svg>";
}

function status() {
  const p = S.path.at(-1);
  return {
    goal: p ? `${Math.max(0, MISSION.goalZone.x - p.x).toFixed(1)} m` : "–",
    heading: p ? `${Math.round(p.h)}°` : "–",
    walked: `${S.walked.toFixed(1)} m`,
    actions: String(S.actions),
  };
}

    <section class="side-card"><h2>Mission</h2><div class="pad">
      <p>${esc(MISSION.goal)}</p>
      <button class="btn-pill btn-blue" data-restart>Restart mission</button></div></section>
    ${S.hideSteps ? "" : `<section class="side-card"><h2>Mission steps<button class="icon-btn" data-hide-steps aria-label="Hide mission steps">${icon("close")}</button></h2>
      ${MISSION.steps.map((name, i) => {
        const posts = S.shown.filter((e) => e._step === i);
        const who = [...new Set(posts.map((e) => e.agent))].filter((k) => k !== "system").slice(0, 3);
        return `<div class="side-item" data-go="home"><div class="news-title">${esc(name)}</div>
          <div class="news-meta">${who.length ? `<span class="stack">${who.map((k) => Avatar(k, "s20")).join("")}</span>` : ""}
          <span>${stepLabel[S.stepStatus[i]]} · ${posts.length} post${posts.length === 1 ? "" : "s"}</span></div></div>`;
      }).join("")}</section>`}
    <section class="side-card"><h2>Where Grayson is</h2>
      <div class="map-box" data-go="map">${MapSvg()}</div>
      ${[["Distance to goal", st.goal], ["Heading", st.heading], ["Walked so far", st.walked]].map(([m, v]) =>
        `<div class="side-item trend" data-go="map"><div><div class="meta">Status · ${m}</div><div class="val">${v}</div></div><button class="icon-btn" aria-label="More">${icon("dots")}</button></div>`).join("")}
      <a class="show-more" data-go="map">Show more</a></section>
    <section class="side-card"><h2>The council</h2>
      ${COUNCIL.slice(0, 3).map((k) => `<div class="row" data-profile="${k}">${Avatar(k)}
        <div class="who"><div class="bold">${AGENTS[k].name}${Verified()}</div><div class="muted">@${AGENTS[k].handle}</div></div>
        <button class="btn-pill btn-light btn-sm" data-profile="${k}">View</button></div>`).join("")}
      <a class="show-more" data-go="agents">Show more</a></section>
    <div class="side-foot"><span>IF Lab</span><span>Grayson, a Unitree Go2 Air</span><span>Sample mission, not live</span></div>`;
}

/* ─── views ─────────────────────────────────────────────────── */
const VIEWS = {
  home() {
    return `<div class="top">${Tabs([["live", "Live"], ["decisions", "Decisions"]], S.view.tab || "live", false, true)}</div>
      <div class="compose">${Avatar("system")}<div class="compose-body">
        <textarea id="compose" rows="1" placeholder="Give Grayson a new mission…" maxlength="200"></textarea>
        <div class="compose-tools"><div class="icons">
          ${["image", "gif", "poll", "emoji", "sched", "pin", "flag"].map((n) => `<button class="icon-btn" aria-label="${n}" tabindex="-1">${icon(n)}</button>`).join("")}
        </div><button class="btn-pill btn-light" id="compose-post" disabled>Post</button></div></div></div>
      <div id="list"></div>`;
  },
  homeList() {
    const decisions = ["proposal", "objection", "approval", "summary", "mission"];
    const evs = S.view.tab === "decisions" ? S.shown.filter((e) => decisions.includes(e.kind)) : S.shown;
    return PostList(evs, "Nothing yet", "Posts from the council show up here as the mission runs.");
  },

  explore() {
    return `<div class="top"><div class="title-bar"><label class="search" style="flex:1">${icon("search")}
      <input id="explore-search" placeholder="Search the council's posts" value="${esc(S.query)}"></label></div></div><div id="list"></div>`;
  },
  exploreList() {
    const q = S.query.trim().toLowerCase();
    if (!q) return `<div class="empty"><h3>Search the mission</h3><p>Try “chair”, “veto” or “wall”.</p></div>`;
    const hits = S.shown.filter((e) => [strip(e.text), AGENTS[e.agent].name, KIND[e.kind], e.action?.tool, e.action?.result].join(" ").toLowerCase().includes(q));
    return PostList(hits, `No results for “${esc(S.query)}”`, "Try a different word, or wait for more posts.");
  },

  notifications() {
    return `<div class="top">${TitleBar("Notifications")}${Tabs([["all", "All"], ["vetoes", "Vetoes"]], S.view.tab || "all")}</div><div id="list"></div>`;
  },
  notificationsList() {
    const notes = [];
    for (const e of S.shown) {
      for (const [who, v] of e.votes || []) notes.push({ e, who, kind: v === "yes" ? "ok" : "no", line: `<b>${AGENTS[who].name}</b> ${v === "yes" ? "approved" : "vetoed"} ${AGENTS[e.agent].name}'s proposal` });
      if (e.kind === "check") notes.push({ e, who: e.agent, kind: "chk", line: `<b>${AGENTS[e.agent].name}</b> ran a check` });
    }
    const list = (S.view.tab === "vetoes" ? notes.filter((n) => n.kind === "no") : notes).reverse();
    if (!list.length) return `<div class="empty"><h3>Nothing to see here yet</h3><p>Approvals, vetoes and checks show up here.</p></div>`;
    return list.map((n) => `<div class="note"><div class="kind-ico ${n.kind}">${icon(n.kind === "chk" ? "ok" : n.kind)}</div>
      <div class="note-body">${Avatar(n.who, "s32")}<div class="line">${n.line}</div><div class="quoted">${strip(n.e.text)}</div></div></div>`).join("");
  },

  agents() {
    return `<div class="top">${TitleBar("Agents", "5 on the council")}</div>
      ${["system", ...COUNCIL].map((k) => `<div class="row" data-profile="${k}" style="align-items:flex-start">${Avatar(k)}
        <div class="who"><div class="bold">${AGENTS[k].name}${Verified()}</div><div class="muted">@${AGENTS[k].handle}</div><div class="bio">${AGENTS[k].bio}</div></div>
        <button class="btn-pill btn-light btn-sm" data-profile="${k}">View</button></div>`).join("")}`;
  },

  profile() {
    const k = S.view.agent, a = AGENTS[k];
    const mine = S.shown.filter((e) => e.agent === k);
    const given = S.shown.flatMap((e) => (e.votes || []).filter((v) => v[0] === k));
    return `<div class="top">${TitleBar(a.name, `${mine.length} post${mine.length === 1 ? "" : "s"}`, true)}</div>
      <div data-agent="${k}"><div class="banner${k === "system" ? " photo" : ""}"></div></div>
      <div class="profile-top"><div class="profile-row">${Avatar(k, "s134")}
        <button class="btn-pill btn-outline">Following</button></div>
        <div class="profile-name">${a.name}<span class="role-pill">${Verified()}${a.role}</span></div>
        <div class="muted">@${a.handle}</div>
        <p class="profile-bio">${a.bio}</p>
        <div class="profile-meta">${k === "system" ? `<span>${icon("pin")}IF Lab</span>` : `<span>${icon("cpu")}claude-haiku-5-5</span>`}${k === "pilot" ? `<span>${icon("tool")}look, move, turn, pose, trick</span>` : ""}<span>${icon("cal")}Joined November 2026</span></div>
        <div class="profile-stats">${k === "system"
          ? `<span><b>1</b> Mission</span><span><b>${COUNCIL.length}</b> Agents</span>`
          : `<span><b>${given.filter((v) => v[1] === "yes").length}</b> Approvals</span><span><b>${given.filter((v) => v[1] === "no").length}</b> Vetoes</span>`}</div>
      </div>
      ${Tabs([["posts", "Posts"], ["replies", "Replies"], ["actions", "Actions"]], S.view.tab || "posts", true)}
      <div id="list"></div>`;
  },
  profileList() {
    const k = S.view.agent, tab = S.view.tab || "posts";
    let evs = S.shown.filter((e) => e.agent === k);
    if (tab === "replies") evs = evs.filter((e) => e.reply_to);
    if (tab === "actions") evs = evs.filter((e) => e.action);
    const what = { posts: "posts", replies: "replies", actions: "actions" }[tab];
    if (k === "system" && tab === "posts") return PinnedVideo() + PostList(evs, "", "").replace(/^<div class="empty">.*<\/div>$/s, "");
    return PostList(evs, `No ${what} yet`, `When @${AGENTS[k].handle} has ${what}, they show up here.`);
  },

  map() {
    return `<div class="top">${TitleBar("Map", "Position from Grayson's odometry", true)}</div><div id="list"></div>`;
  },
  mapList() {
    const st = status();
    return `<div style="padding:12px 16px">${MapSvg()}</div>
      ${[["Distance to goal", st.goal], ["Heading", st.heading], ["Walked so far", st.walked], ["Actions taken", st.actions]].map(([m, v]) =>
        `<div class="side-item trend" style="cursor:default"><div><div class="meta">Status · ${m}</div><div class="val">${v}</div></div></div>`).join("")}`;
  },

  log() {
    return `<div class="top">${TitleBar("Log", "One JSON line per post, the format the agents will write", true)}</div><div id="list"></div>`;
  },
  logList() {
    if (!S.shown.length) return `<div class="empty"><h3>No lines yet</h3><p>Each post adds a line here.</p></div>`;
    return `<pre class="log">${S.shown.map(({ _at, _step, ...e }) => esc(JSON.stringify({ t: new Date(_at).toISOString(), ...e }))).join("\n")}</pre>`;
  },

  more() {
    return `<div class="top">${TitleBar("Playback", "This page replays a sample mission", true)}</div>
      <h3 class="section-title">Speed</h3>
      ${[1, 2, 4].map((v) => `<div class="row" data-speed="${v}"><div class="who">${v}×${v === 1 ? " (one post every 2 s)" : ""}</div><span class="radio${S.speed === v ? " on" : ""}"></span></div>`).join("")}
      <h3 class="section-title">Mission</h3>
      <div class="row" data-restart><div class="who">Restart mission</div>${icon("restart")}</div>
      <div class="row" data-toggle-play><div class="who">${S.playing ? "Pause" : "Resume"} playback</div>${solid(S.playing ? "pause" : "play")}</div>`;
  },
};

function renderList() {
  const fn = VIEWS[S.view.name + "List"];
  const el = $("#list");
  if (fn && el) el.innerHTML = fn();
}
function renderView() {
  $("#view").innerHTML = VIEWS[S.view.name]();
  renderList();
  renderNav();
  renderSide();
}
function go(name, extra = {}) {
  S.view = { name, ...extra };
  if (name === "notifications") S.unread = 0;
  renderView();
  window.scrollTo(0, 0);
}

/* ─── playback ──────────────────────────────────────────────── */
function reset(goal = DEFAULT_GOAL) {
  clearTimeout(S.timer);
  MISSION.goal = goal;
  Object.assign(S, { shown: [], byId: {}, i: 0, path: [], walked: 0, actions: 0, step: 0, unread: 0, newestId: null,
    stepStatus: MISSION.steps.map(() => "todo") });
  renderView();
  schedule(500);
}

function schedule(ms) {
  clearTimeout(S.timer);
  if (!S.playing || S.i >= SAMPLE_EVENTS.length) return;
  S.timer = setTimeout(() => { post(SAMPLE_EVENTS[S.i++]); schedule(DELAY / S.speed); }, ms);
}

function post(src) {
  const ev = { ...src, _at: Date.now(), _step: S.step };
  if (ev.kind === "mission") ev.text = `New mission: <b>${esc(MISSION.goal)}</b>\nObstacle avoidance on. 150 steps max.`;
  if (ev.step_active != null) { S.stepStatus[ev.step_active] = "active"; S.step = ev._step = ev.step_active; }
  if (ev.step_done != null) S.stepStatus[ev.step_done] = "done";
  if (ev.action) S.actions++;
  if (ev.pose) {
    const prev = S.path.at(-1);
    if (prev) S.walked += Math.hypot(ev.pose.x - prev.x, ev.pose.y - prev.y);
    S.path.push(ev.pose);
  }
  if (S.view.name !== "notifications") S.unread += (ev.votes || []).length + (ev.kind === "check" ? 1 : 0);
  S.shown.push(ev);
  S.byId[ev.id] = ev;
  S.newestId = ev.id;
  renderList();
  renderNav();
  if (document.activeElement?.id !== "side-search") renderSide();
}

function setPlaying(on) {
  S.playing = on;
  const b = $("#fab-play");
  b.innerHTML = solid(on ? "pause" : "play");
  b.setAttribute("aria-label", on ? "Pause playback" : "Resume playback");
  schedule(300);
  if (S.view.name === "more") renderView();
}
function setSpeed(v) {
  S.speed = v;
  $("#fab-speed .lbl").textContent = `${v}×`;
  schedule(DELAY / v);
  if (S.view.name === "more") renderView();
}

/* ─── events ────────────────────────────────────────────────── */
document.addEventListener("click", (e) => {
  if (e.target.closest("#compose-post")) {
    const goal = $("#compose").value.trim();
    if (goal) reset(/[.!?]$/.test(goal) ? goal : goal + ".");
    return;
  }
  const t = e.target.closest("[data-go],[data-profile],[data-tab],[data-restart],[data-hide-steps],[data-speed],[data-toggle-play]");
  if (!t) return;
  e.preventDefault();
  if (t.dataset.profile) return go("profile", { agent: t.dataset.profile });
  if (t.dataset.go) { go(t.dataset.go); if (t.dataset.focus) $("#compose")?.focus(); return; }
  if (t.dataset.tab) { S.view.tab = t.dataset.tab; return renderView(); }
  if (t.hasAttribute("data-restart")) return reset(MISSION.goal);
  if (t.hasAttribute("data-hide-steps")) { S.hideSteps = true; return renderSide(); }
  if (t.dataset.speed) return setSpeed(Number(t.dataset.speed));
  if (t.hasAttribute("data-toggle-play")) return setPlaying(!S.playing);
});
document.addEventListener("input", (e) => {
  if (e.target.id === "compose") $("#compose-post").disabled = !e.target.value.trim();
  if (e.target.id === "explore-search") { S.query = e.target.value; renderList(); }
  if (e.target.id === "side-search") {
    S.query = e.target.value;
    if (S.view.name !== "explore") { go("explore"); const i = $("#explore-search"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
    else { $("#explore-search").value = S.query; renderList(); }
  }
});
$("#fab-play").addEventListener("click", () => setPlaying(!S.playing));
$("#fab-speed").addEventListener("click", () => setSpeed([1, 2, 4][([1, 2, 4].indexOf(S.speed) + 1) % 3]));
setInterval(() => document.querySelectorAll("time[data-at]").forEach((t) => (t.textContent = ago(+t.dataset.at))), 1000);

setPlaying(true);
reset();
</script>
</body>
</html>
